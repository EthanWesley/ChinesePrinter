<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中文打字机</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #0f1117;
      color: #e4e6eb;
    }
    .topbar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px;
      background: #1a1d27;
      border-bottom: 1px solid #2d3142;
      flex-shrink: 0;
    }
    .topbar .icon { font-size: 18px; }
    .topbar .title { font-size: 13px; font-weight: 600; flex: 1; }
    .topbar .target {
      font-size: 11px; color: #8b8fa3;
      font-family: "Consolas", monospace;
      max-width: 50%; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    button {
      padding: 4px 10px; border: none; border-radius: 4px;
      font-size: 12px; cursor: pointer; font-family: inherit;
      background: #252836; color: #e4e6eb;
      border: 1px solid #2d3142;
    }
    button:hover { border-color: #5b9dff; }
    .content {
      flex: 1; height: calc(100vh - 44px);
    }
    iframe {
      width: 100%; height: 100%; border: none;
      background: #0f1117;
    }
    .error {
      padding: 20px; font-size: 13px; line-height: 1.6;
      color: #ff5c5c; text-align: center;
    }
    .error .hint { color: #8b8fa3; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="icon">⌨️</span>
    <span class="title">中文打字机</span>
    <span class="target" id="target">-</span>
    <button id="refreshBtn" title="重新加载">↻ 刷新</button>
  </div>
  <div class="content" id="content">
    <iframe id="frame" src="about:blank"></iframe>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
